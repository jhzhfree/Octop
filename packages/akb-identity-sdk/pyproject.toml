[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "akb-identity-sdk"
version = "0.1.0"
description = "Independent Python SDK for AKB V2 Agent identity and MCP access"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["cryptography>=41", "PyJWT>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/akb_identity_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
