name: Agent identity SDK and OpenCode plugin
on:
  push:
    paths: ["integrations/**", ".github/workflows/agent-identity.yml"]
  pull_request:
    paths: ["integrations/**", ".github/workflows/agent-identity.yml"]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm test && npm pack
        working-directory: integrations/agent-identity-sdk
      - run: npm ci && npm test && npm pack
        working-directory: integrations/opencode-identity
      - run: node verify-design.mjs
        working-directory: integrations/agent-identity-spec
