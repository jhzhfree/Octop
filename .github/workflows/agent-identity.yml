name: Agent identity SDK
on:
  push:
    paths: ["tools/agent-keygen/**", "integrations/**", ".github/workflows/agent-identity.yml"]
  pull_request:
    paths: ["tools/agent-keygen/**", "integrations/**", ".github/workflows/agent-identity.yml"]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test && npm pack
        working-directory: tools/agent-keygen
      - run: npm ci && npm test && npm pack
        working-directory: integrations/agent-identity-sdk
      - run: node verify-design.mjs
        working-directory: integrations/agent-identity-spec
      - run: node test-packages.mjs "$(realpath ../agent-identity-sdk/akb-agent-identity-sdk-*.tgz)"
        working-directory: integrations/agent-identity-spec
      - uses: actions/upload-artifact@v4
        with:
          name: agent-identity-packages
          if-no-files-found: error
          path: |
            tools/agent-keygen/akb-agent-keygen-*.tgz
            integrations/agent-identity-sdk/akb-agent-identity-sdk-*.tgz
